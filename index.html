if(stale){

}else{

}
}else{

function render(){
var osc=document.querySelector('.scroll'),keep=osc?osc.scrollLeft:null;
app.textContent='';
var wrap=el('div','wrap'),head=el('header','head'),hl=el('div');
hl.appendChild(el('div','eyebrow','מיפוי מוקד'));
var h1=el('h1','',S.title);if(editing){h1.contentEditable='true';h1.onblur=function(){S.title=h1.textContent.trim().slice(0,80)||'מי יושב איפה'}}
hl.appendChild(h1);
var sc=seats(),tot=0,nt=0,nc=0,nu=0;for(var k in sc.center)tot+=sc.center[k];S.centers.forEach(function(ce){if(ce.unit)nu++;else{nc++;nt+=S.teams.filter(function(x){return x.center===ce.id}).length}});
var sq=0,sp=0,has=false;S.centers.forEach(function(ce){if(ce.q>0&&ce.p!=null){sq+=ce.q;sp+=ce.p;has=true}});
hl.appendChild(el('p','sub',tot+' עמדות של נציגים ומנהלים, '+nt+' צוותים, '+nc+' מוקדים'+(nu?(nu===1?' ויחידה אחת':' ו-'+nu+' יחידות'):'')+' בקומה אחת. כל מוקד בצבע משלו, ומנהלים בגוון כהה.'+(has?' תקינה כוללת '+sq+', נפשות '+sp+(S.staffDate?' (נכון ל-'+heDate(S.staffDate)+').':'.'):'')));
head.appendChild(hl);head.appendChild(renderBar());wrap.appendChild(head);
wrap.appendChild(renderCards());
if(!editing)wrap.appendChild(el('p','cards-hint','לוחצים על צוות או על שם המוקד כדי לראות איפה הם יושבים במפה.'));
var panel=el('section','panel'),top=el('div','ptop');top.appendChild(el('h2','','מפת הקומה'));
var lg=el('div','legend');
var nk={};S.slots.forEach(function(s){nk[s.k]=(nk[s.k]||0)+1});
[['עמדות נציגים','background:color-mix(in srgb,var(--accent) 22%,var(--card))',nk.a||0],['עמדות מנהלי צוות','background:var(--accent)',nk.m||0],['אחמ״ש או מנהל/ת מוקד','background:var(--accent)'],['חדר או תפקיד מטה','border:1px solid var(--line2)'],['עמדה ללא שיוך','border:1px dashed var(--muted)']].forEach(function(x){var sp=el('span',x.length>2?'cnt':''),i=el('i');i.style.cssText=x[1];i.setAttribute('aria-hidden','true');sp.appendChild(i);if(x.length>2)sp.appendChild(el('b','',String(x[2])));sp.appendChild(document.createTextNode(x[0]));lg.appendChild(sp)});
top.appendChild(lg);panel.appendChild(top);
if(focus&&!editing){var fb=el('div','focus');fb.appendChild(el('span','','מודגש במפה: '));fb.lastChild.appendChild(el('b','',focusName()));fb.appendChild(btn('ביטול ההדגשה',false,function(){focus=null;render()}));panel.appendChild(fb)}
if(editing)panel.appendChild(renderEditor());
var mb=el('div','mapbar');mb.appendChild(btn(overview?'הגדלת המפה':'הקטנה לכל הקומה',false,function(){overview=!overview;render();var s=document.querySelector('.scroll');if(s)s.scrollLeft=0;if(focus)toFocus(false)}));panel.appendChild(mb);
panel.appendChild(renderMap());
panel.appendChild(el('p','maphint',overview?'זו תצוגה מוקטנת של כל הקומה. ״הגדלת המפה״ מחזירה לגודל קריא.':'גוללים הצידה כדי לראות את כל הקומה.'));
wrap.appendChild(panel);
var upd=S.updated?new Date(S.updated+'T12:00:00').toLocaleDateString('he-IL'):'טרם עודכן';
wrap.appendChild(el('footer','foot','הספירה כוללת נציגים בלבד, בלי מנהלי צוות ואחמ״שים. עודכן: '+upd));
app.appendChild(wrap);document.title=S.title;fit();
if(keep!=null){var nsc=document.querySelector('.scroll');if(nsc)nsc.scrollLeft=keep}}
function fit(){var sc=document.querySelector('.scroll');if(!sc)return;var w=sc.clientWidth-8;if(w<=0)return;
var z=Math.min(1.6,w/1288),narrow=z<0.8,p=document.querySelector('.panel');if(p)p.classList.toggle('narrow',narrow);
sc.firstChild.style.zoom=String(narrow&&!overview?0.8:z)}
function toFocus(smooth){var sc=document.querySelector('.scroll');if(!sc||sc.scrollWidth<=sc.clientWidth+2)return;
var hs=sc.querySelectorAll('.s:not(.dim)');if(!hs.length)return;var lo=Infinity,hi=-Infinity;
for(var i=0;i<hs.length;i++){var r=hs[i].getBoundingClientRect();lo=Math.min(lo,r.left);hi=Math.max(hi,r.right)}
var sr=sc.getBoundingClientRect(),d=hi-lo<=sr.width?(lo+hi)/2-(sr.left+sr.right)/2:hi-sr.right+16;
sc.scrollBy({left:d,behavior:smooth?'smooth':'auto'})}
function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function buildDoc(){
var css=document.getElementById('css').textContent,code=document.getElementById('code').textContent;
var data=JSON.stringify(S).replace(/</g,'\\u003c');
return '<!doctype html>\n<html lang="he" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>'+escHtml(S.title)+'</title>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">\n<style id="css">'+css+'</style>\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="state">'+data+'</scr'+'ipt>\n<script id="code">'+code+'</scr'+'ipt>\n</body>\n</html>\n'}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fileSave(){
var html=buildDoc();
if(dl)return dl.save({filename:'call-center-map.html',data:html});
var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='call-center-map.html';document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}
function download(){fileSave().then(function(){status='';render()},function(e){if(e&&e.code==='declined')return;status='ההורדה לא הצליחה. אפשר לנסות שוב.';statusErr=true;render()})}
function save(){
if(busy)return;var prev=S.updated;S.updated=today();
if(!art&&remote==='ok')return saveRemote(prev);
if(!art){fileSave().then(function(){editing=false;sel=-1;status='הקובץ המעודכן ירד למחשב.';statusErr=false;render()},function(){S.updated=prev;status='השמירה לא הצליחה. אפשר לנסות שוב.';statusErr=true;render()});return}
busy=true;status='שומר…';statusErr=false;render();
art.publish(buildDoc()).then(function(){busy=false},function(e){
busy=false;S.updated=prev;var code=e&&e.code;
if(code==='conflict')return;
if(code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='consent_required'||code==='capability_disabled'||code==='capability_removed'){status='אין לך הרשאת עריכה לדף הזה, ולכן השינויים לא נשמרו.';art=null}
else if(code==='rate_limited')status='נשמרו יותר מדי גרסאות ברצף. כדאי לחכות דקה ולנסות שוב.';
else status='השמירה לא הצליחה. אפשר לנסות שוב.';
statusErr=true;render()})}
function clean(o){
if(!o||o.layout!==LAYOUT||!Array.isArray(o.slots)||o.slots.length!==S.slots.length)return null;
var out=[];
for(var i=0;i<o.slots.length;i++){
var s=o.slots[i]||{},k=s.k,isLead=lead(k);
if(['a','m','h','c','r','u'].indexOf(k)<0)return null;
var t=isLead&&team(s.t)?s.t:null;if(isLead&&!t)return null;
out.push(migrate({k:k,t:t,x:k==='u'||typeof s.x!=='string'?'':s.x.trim().slice(0,40)}))}
return {title:typeof o.title==='string'&&o.title.trim()?o.title.trim().slice(0,80):S.title,updated:/^\d{4}-\d{2}-\d{2}$/.test(o.updated)?o.updated:S.updated,slots:out}}
function getRemote(){
return fetch(DOCS+'/maps/main?key='+FB.key,{cache:'no-store'}).then(function(r){
if(r.status===404)return null;if(!r.ok)throw new Error(String(r.status));return r.json()})}
function loadRemote(){
getRemote().then(function(d){
remote='ok';rUpd=null;rRev=0;if(!d)return;
var f=d.fields||{},c=null;rUpd=d.updateTime;rRev=Number(f.rev&&f.rev.integerValue)||0;
try{c=clean(JSON.parse(f.data.stringValue))}catch(e){}
if(c){S.title=c.title;S.updated=c.updated;S.slots=c.slots}
}).then(function(){status='';statusErr=false},function(){remote='off';status='לא הצלחנו לטעון את הגרסה המשותפת, ולכן מוצגת הגרסה השמורה בקובץ. שמירה תוריד קובץ.';statusErr=true}).then(render)}
function saveRemote(prev){
busy=true;status='שומר…';statusErr=false;render();
var fields={data:{stringValue:JSON.stringify({layout:LAYOUT,title:S.title,updated:S.updated,slots:S.slots})},rev:{integerValue:String(rRev+1)}};
var tr=[{fieldPath:'at',setToServerValue:'REQUEST_TIME'}],hid=String(rRev+1).padStart(6,'0')+'-'+Math.random().toString(36).slice(2,8);
var body={writes:[{update:{name:NAME+'/maps/main',fields:fields},updateTransforms:tr,currentDocument:rUpd?{updateTime:rUpd}:{exists:false}},{update:{name:NAME+'/history/'+hid,fields:fields},updateTransforms:tr,currentDocument:{exists:false}}]};
function fail(msg){
getRemote().then(function(d){var r=d?Number(d.fields&&d.fields.rev&&d.fields.rev.integerValue)||0:0;return r!==rRev},function(){return false}).then(function(changed){
busy=false;S.updated=prev;statusErr=true;
if(changed){stale=true;status='מישהו אחר שמר שינויים בזמן שערכת, ולכן השינויים שלך לא נשמרו. אפשר להוריד אותם כקובץ, או לטעון את הגרסה העדכנית ולערוך שוב.'}else status=msg;
render()})}
fetch(DOCS+':commit?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
return r.json().catch(function(){return {}}).then(function(d){
if(!r.ok)return fail(d.error&&d.error.status==='PERMISSION_DENIED'?'השמירה נדחתה. ייתכן שהשינוי חורג מהמבנה המותר.':'השמירה לא הצליחה. אפשר לנסות שוב.');
busy=false;rRev++;rUpd=(d.writeResults&&d.writeResults[0]&&d.writeResults[0].updateTime)||d.commitTime||rUpd;
editing=false;sel=-1;status='נשמר. כל מי שפותח את הקישור יראה את המפה המעודכנת.';statusErr=false;render()})
},function(){fail('השמירה לא הצליחה. כדאי לבדוק את החיבור לאינטרנט ולנסות שוב.')})}
render();
loadRemote();
window.addEventListener('resize',fit);
if(window.claude&&window.claude.use){
window.claude.use('artifact').then(function(a){art=a;if(a)render()},function(){});
window.claude.use('downloads').then(function(d){dl=d;if(d)render()},function(){});
}
})();
